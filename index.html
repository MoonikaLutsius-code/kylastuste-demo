<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8" />
  <title>Külastuste ja müügi demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: #F7F5F1;
      color: #2B2B2B;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 60px;
    }
    h1 {
      font-size: 1.5rem;
      margin: 0 0 4px;
    }
    p.subtitle {
      margin: 0 0 24px;
      color: #6B6B6B;
      max-width: 640px;
      text-align: center;
      font-size: 0.95rem;
    }
    #controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }
    #controls label {
      font-size: 0.9rem;
      color: #444;
    }
    select {
      font-size: 0.95rem;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #CCC;
      background: white;
    }
    #note {
      max-width: 640px;
      font-size: 0.85rem;
      color: #8A5A00;
      background: #FFF6E5;
      border: 1px solid #F0DDB0;
      border-radius: 6px;
      padding: 8px 12px;
      margin-top: 14px;
      display: none;
      text-align: center;
    }
    #note.visible {
      display: block;
    }
    #conclusion {
      max-width: 640px;
      font-size: 0.95rem;
      color: #2B2B2B;
      background: #EFEDE7;
      border-left: 3px solid #8A857A;
      border-radius: 4px;
      padding: 10px 14px;
      margin-top: 16px;
      text-align: left;
    }
  </style>
</head>
<body>
  <h1>Külastuste ja müügi demo</h1>
  <p class="subtitle">
    Iga kliendi kuine müük ajas, koos külastuste märgistusega.
    Vali klient allolevast rippmenüüst.
  </p>

  <div id="controls">
    <label for="customerSelect">Klient:</label>
  </div>

  <div id="canvas-holder"></div>

  <div id="note"></div>
  <div id="conclusion"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
